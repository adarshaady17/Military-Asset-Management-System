services:
  postgres:
    image: postgres:17-alpine
    container_name: mams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mams
      POSTGRES_USER: mams
      POSTGRES_PASSWORD: mams_dev_password
    ports:
      - "5432:5432"
    volumes:
      - mams-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mams -d mams"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mams-postgres-data:
